# Netlify Konfiguratsiya Fayli
[build]
  publish = "."

# Chiroyli URL yo'naltirishlari
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/catalog"
  to = "/catalog.html"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/cart.html"
  status = 200

[[redirects]]
  from = "/portfolio"
  to = "/portfolio.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

# Agar backend server (Node.js) alohida xizmatda (Render, Railway, VPS) joylashtirilsa,
